services:
  web:
    image: nginx:alpine
    restart: on-failure
    volumes:
      - ./:/app:ro
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx.main.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
