server {
    listen 3000;
    server_name _;

    root /app;
    index ui_kits/website/index.html;

    # Entry point: the Farmstand 1959 site lives at /ui_kits/website/index.html
    location = / {
        try_files /ui_kits/website/index.html =404;
    }

    # Serve everything else (styles.css, ds-loader.js, _ds_bundle.js,
    # assets/, tokens/, ui_kits/*.jsx) straight from the repo root.
    location / {
        try_files $uri =404;
    }
}
